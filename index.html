<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Overtime and amenities tracker for payroll">
    <meta name="theme-color" content="#2196F3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
    <title>Payroll Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.svg">
    <style>
        /* Admin View Styles */
        .is-admin .input-section { display: none !important; }
        .is-admin .edit-btn { display: none !important; }
        .is-admin .action-section { display: none !important; }
        #admin-section { margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 8px; }
    </style>
</head>
<body>
    <!-- Login View -->
    <div id="login-view" class="hidden">
        <div class="login-container">
            <div class="login-box">
                <h1>Payroll Tracker</h1>
                <form id="loginForm">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="login-btn">Login</button>
                    <p id="errorMessage" class="error-message"></p>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App View -->
    <div id="app-view" class="container hidden">
        <header>
            <div class="header-content">
                <h1 id="headerTitle">Payroll Tracker</h1>
                <div class="header-controls">
                    <button id="userMenuBtn" class="clear-cache-btn" aria-label="Open user menu">
                        👤
                    </button>
                </div>
            </div>
        </header>

        <div class="date-section">
            <h2 class="current-date"> Today: </h2><h2 id="currentDate" class="current-date"></h2>
        </div>

        <!-- Admin/Renita Section -->
        <div id="admin-section" class="hidden">
            <h3>Select User to View</h3>
            <div id="userButtons" class="input-row" style="flex-wrap: wrap; justify-content: center;"></div>
        </div>

        <div class="input-section">
            <div class="input-row">
                <div class="pm-dusk-switch">
                    <button class="switch-btn active" data-mode="pm">PM</button>
                    <button class="switch-btn" data-mode="dusk">DUSK</button>
                </div>
                <div class="quantity-display">
                    <span class="quantity" data-type="pm-dusk">0</span>
                    <button class="quantity-btn" data-action="remove" data-type="pm-dusk">-1</button>
                </div>
                <button class="quantity-btn" data-action="add" data-type="pm-dusk">+1</button>
                <button class="entry-btn" data-type="pm-dusk">Add</button>
            </div>
            
            <div class="input-row">
                <button class="entry-btn" data-type="overtime">ADD OVERTIME</button>
                <button class="quantity-btn" data-action="add" data-type="overtime">+0.25</button>
                <div class="quantity-display">
                    <span class="quantity" data-type="overtime">0</span>
                    <button class="quantity-btn" data-action="remove" data-type="overtime">-0.25</button>
                </div>
            </div>
            
            <div class="input-row">
                <select id="commissionType" class="entry-select">
                    <option value="">-- Select Commission --</option>
                </select>
                <button class="entry-btn" data-type="commission">Add Commission</button>
            </div>

            <div class="input-row mech-only">
                <button class="entry-btn" data-type="amenity">Mech overtime</button>
                <button class="quantity-btn" data-action="add" data-type="amenity">+0.25</button>
                <div class="quantity-display">
                    <span class="quantity" data-type="amenity">0</span>
                    <button class="quantity-btn" data-action="remove" data-type="amenity">-0.25</button>
                </div>
            </div>
        </div>

        <div class="days-section">
            <div class="days-header">
                <button class="nav-btn" id="prevBtn">← PAST</button>
                <h2 id="dateRange">15 Days</h2>
                <button class="nav-btn" id="nextBtn">NEXT →</button>
            </div>
            
            <div class="grid-container">
                <div class="grid-inner">
                    <div class="grid-header">
                        <div class="header-cell">Date</div>
                        <div class="header-cell">Overtime</div>
                        <div class="header-cell">Commission</div>
                        <div class="header-cell mech-only">Mech overtime</div>
                        <div class="header-cell">Total</div>
                        <div class="header-cell">Actions</div>
                    </div>
                    <div id="daysGrid" class="days-grid"></div>
                </div>
            </div>
        </div>
        
        <div class="total-section">
            Period Total: $<span id="periodTotalValue">0.00</span>
        </div>

        <div class="action-section hidden">
            <button id="sendBtn" class="send-btn">SEND</button>
        </div>
    </div>

    <!-- Edit Dialog -->
    <div id="editDialog" class="edit-dialog">
        <div class="edit-dialog-content">
            <div class="edit-dialog-header">
                <h3>Edit Entry</h3>
                <button class="close-dialog">&times;</button>
            </div>
            <div class="edit-dialog-body">
                <div class="edit-group">
                    <label>PM/DUSK</label>
                    <div class="edit-controls" id="editPmDuskControls">
                        <div class="pm-dusk-switch">
                            <button class="switch-btn" data-mode="pm">PM</button>
                            <button class="switch-btn" data-mode="dusk">DUSK</button>
                        </div>
                        <div class="number-input">
                            <button class="minus">−</button>
                            <input type="number" id="pmDuskValue" min="0" value="0">
                            <button class="plus">+</button>
                        </div>
                    </div>
                </div>
                <div class="edit-group">
                    <label>Overtime</label>
                    <div class="number-input">
                        <button class="minus">−</button>
                        <input type="number" id="overtimeValue" min="0" step="0.25" value="0">
                        <button class="plus">+</button>
                    </div>
                </div>
                <div class="edit-group">
                    <label>Commissions</label>
                    <div id="editCommissionsList" class="commission-list">
                        <!-- Commission items will be rendered here by JS -->
                    </div>
                    <div class="commission-add-controls">
                        <select id="editCommissionType" class="entry-select">
                            <option value="">-- Add Commission --</option>
                        </select>
                        <button id="addCommissionBtn" class="edit-btn">Add</button>
                    </div>
                </div>
                <div class="edit-group mech-only">
                    <label>Mech overtime</label>
                    <div class="number-input">
                        <button class="minus">−</button>
                        <input type="number" id="amenityValue" min="0" step="0.25" value="0">
                        <button class="plus">+</button>
                    </div>
                </div>
            </div>
            <div class="edit-dialog-footer">
                <button class="cancel-btn">Cancel</button>
                <button class="save-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- User Menu Overlay -->
    <div id="userMenuOverlay" class="overlay-menu hidden">
        <div class="overlay-menu-content">
            <h3>Settings</h3>
            <div class="theme-options">
                <button class="theme-btn" data-theme="light">Light</button>
                <button class="theme-btn" data-theme="dark">Dark</button>
                <button class="theme-btn" data-theme="auto">Auto</button>
            </div>
            <button id="menuLogoutBtn" class="menu-logout-btn">Logout</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Register service worker with correct scope
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swPath = './service-worker.js';
                navigator.serviceWorker.register(swPath, { scope: './' })
                    .then(reg => {
                        console.log('Service Worker registered:', reg.scope);
                        
                        // Check for updates immediately and periodically
                        reg.update();
                        
                        // Check for updates every 60 seconds
                        setInterval(() => {
                            reg.update();
                        }, 60000);
                        
                        // Listen for service worker updates
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New service worker available, prompt user to refresh
                                    if (confirm('New version available! Reload to update?')) {
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(err => console.log('Service Worker registration failed:', err));
                
                // Listen for service worker controller changes
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    // Reload when new service worker takes control
                    window.location.reload();
                });
            });
        }
    </script>
</body>
</html>
