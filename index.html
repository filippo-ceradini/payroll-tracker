<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Overtime and amenities tracker for payroll">
    <meta name="theme-color" content="#2196F3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
    <title>Payroll Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg width='192' height='192' viewBox='0 0 192 192' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='192' height='192' rx='48' fill='%232196F3'/%3E%3Crect x='24' y='50' width='144' height='118' rx='12' fill='white'/%3E%3Cpath d='M24 62C24 55.3726 29.3726 50 36 50H156C162.627 50 168 55.3726 168 62V82H24V62Z' fill='%231976D2'/%3E%3Ctext x='96' y='138' font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif' font-size='64' font-weight='700' text-anchor='middle' fill='%23333'%3E15%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg width='192' height='192' viewBox='0 0 192 192' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='192' height='192' rx='48' fill='%232196F3'/%3E%3Crect x='24' y='50' width='144' height='118' rx='12' fill='white'/%3E%3Cpath d='M24 62C24 55.3726 29.3726 50 36 50H156C162.627 50 168 55.3726 168 62V82H24V62Z' fill='%231976D2'/%3E%3Ctext x='96' y='138' font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif' font-size='64' font-weight='700' text-anchor='middle' fill='%23333'%3E15%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Payroll Tracker</h1>
                <div class="header-controls">
                    <button id="clearCacheBtn" class="clear-cache-btn" aria-label="Clear stored data">
                        🗑️
                    </button>
                    <button id="darkModeToggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
                        <span class="dark-icon">🌙</span>
                        <span class="light-icon">☀️</span>
                    </button>
                </div>
            </div>
        </header>

        <div class="date-section">
            <h2 id="currentDate" class="current-date"></h2>
        </div>

        <div class="input-section">
            <div class="input-row">
                <div class="pm-dusk-switch">
                    <button class="switch-btn active" data-mode="pm">PM</button>
                    <button class="switch-btn" data-mode="dusk">DUSK</button>
                </div>
                <div class="quantity-display">
                    <span class="quantity" data-type="pm-dusk">0</span>
                    <button class="quantity-btn" data-action="remove" data-type="pm-dusk">-1</button>
                </div>
                <button class="quantity-btn" data-action="add" data-type="pm-dusk">+1</button>
                <button class="entry-btn" data-type="pm-dusk">Add</button>
            </div>
            
            <div class="input-row">
                <button class="entry-btn" data-type="overtime">OVERTIME</button>
                <button class="quantity-btn" data-action="add" data-type="overtime">+1</button>
                <div class="quantity-display">
                    <span class="quantity" data-type="overtime">0</span>
                    <button class="quantity-btn" data-action="remove" data-type="overtime">-1</button>
                </div>
            </div>
            
            <div class="input-row">
                <button class="entry-btn" data-type="amenity">Mech overtime</button>
                <button class="quantity-btn" data-action="add" data-type="amenity">+1</button>
                <div class="quantity-display">
                    <span class="quantity" data-type="amenity">0</span>
                    <button class="quantity-btn" data-action="remove" data-type="amenity">-1</button>
                </div>
            </div>
        </div>

        <div class="days-section">
            <div class="days-header">
                <button class="nav-btn" id="prevBtn">← PAST</button>
                <h2 id="dateRange">15 Days</h2>
                <button class="nav-btn" id="nextBtn">NEXT →</button>
            </div>
            
            <div class="grid-container">
                <div class="grid-inner">
                    <div class="grid-header">
                        <div class="header-cell">Day</div>
                        <div class="header-cell">Date</div>
                        <div class="header-cell">PM DUSK</div>
                        <div class="header-cell">Overtime</div>
                        <div class="header-cell">Mech overtime</div>
                        <div class="header-cell">Actions</div>
                    </div>
                    <div id="daysGrid" class="days-grid"></div>
                </div>
            </div>
        </div>

        <div class="action-section">
            <button id="sendBtn" class="send-btn">SEND</button>
        </div>
    </div>

    <!-- Edit Dialog -->
    <div id="editDialog" class="edit-dialog">
        <div class="edit-dialog-content">
            <div class="edit-dialog-header">
                <h3>Edit Entry</h3>
                <button class="close-dialog">&times;</button>
            </div>
            <div class="edit-dialog-body">
                <div class="edit-group">
                    <label>PM/DUSK</label>
                    <div class="edit-controls">
                        <div class="edit-value-group">
                            <label>PM</label>
                            <div class="number-input">
                                <button class="minus">−</button>
                                <input type="number" id="pmValue" min="0" value="0">
                                <button class="plus">+</button>
                            </div>
                        </div>
                        <div class="edit-value-group">
                            <label>DUSK</label>
                            <div class="number-input">
                                <button class="minus">−</button>
                                <input type="number" id="duskValue" min="0" value="0">
                                <button class="plus">+</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="edit-group">
                    <label>Overtime</label>
                    <div class="number-input">
                        <button class="minus">−</button>
                        <input type="number" id="overtimeValue" min="0" value="0">
                        <button class="plus">+</button>
                    </div>
                </div>
                <div class="edit-group">
                    <label>Mech overtime</label>
                    <div class="number-input">
                        <button class="minus">−</button>
                        <input type="number" id="amenityValue" min="0" value="0">
                        <button class="plus">+</button>
                    </div>
                </div>
            </div>
            <div class="edit-dialog-footer">
                <button class="cancel-btn">Cancel</button>
                <button class="save-btn">Save</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Register service worker with correct scope
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swPath = './service-worker.js';
                navigator.serviceWorker.register(swPath, { scope: './' })
                    .then(reg => {
                        console.log('Service Worker registered:', reg.scope);
                        
                        // Check for updates immediately and periodically
                        reg.update();
                        
                        // Check for updates every 60 seconds
                        setInterval(() => {
                            reg.update();
                        }, 60000);
                        
                        // Listen for service worker updates
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New service worker available, prompt user to refresh
                                    if (confirm('New version available! Reload to update?')) {
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(err => console.log('Service Worker registration failed:', err));
                
                // Listen for service worker controller changes
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    // Reload when new service worker takes control
                    window.location.reload();
                });
            });
        }
    </script>
</body>
</html>
